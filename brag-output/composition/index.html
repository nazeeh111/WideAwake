<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>WideAwake — Set a time. Close the lid.</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#132C35;color:#F8F3E9;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}
#film,.scene{position:absolute;inset:0;width:1280px;height:720px}.scene{background:#132C35}.scene-content{width:100%;height:100%;padding:76px 88px;display:flex;flex-direction:column;justify-content:center;gap:24px}h1,h2,p{margin:0}h1{font-size:88px;line-height:1.08;letter-spacing:-4px;font-weight:650}h2{font-size:64px;line-height:1.1;letter-spacing:-2.4px;font-weight:620}.brand{display:flex;align-items:center;gap:24px;font-size:32px;font-weight:600;letter-spacing:-.7px}.brand img{width:76px;height:76px;border-radius:18px}.eyebrow{color:#F0AB32;font-size:22px;font-weight:600;letter-spacing:2px;text-transform:uppercase}.split{flex-direction:row;align-items:center;gap:64px}.words{width:460px;display:flex;flex-direction:column;gap:26px}.panel{width:520px;height:auto;flex-shrink:0;border-radius:14px}.detail{font-size:27px;line-height:1.4;color:#CCD4D2}.outro{align-items:center;text-align:center;gap:28px}.outro img{width:132px;height:132px;border-radius:30px}.outro h2{font-size:82px}.url{font-size:30px;color:#F0AB32;letter-spacing:-.7px}
</style></head><body>
<div id="film" data-composition-id="wideawake-demo" data-start="0" data-duration="18" data-width="1280" data-height="720">
<section id="hook" class="scene clip" data-start="0" data-duration="4" data-track-index="1"><div class="scene-content"><div class="brand"><img src="assets/icon.png" alt="Sunrise icon">WideAwake</div><h1>Set a time.<br>Close the lid.</h1></div></section>
<section id="select" class="scene clip" data-start="4" data-duration="6" data-track-index="1"><div class="scene-content split"><div class="words"><p class="eyebrow">Choose your time</p><h2>15-minute steps.<br>Up to 6 hours.</h2><p class="detail">The timer starts<br>when the lid closes.</p></div><img class="panel" src="assets/panel-ready.svg" alt="Actual WideAwake Ready panel at 1 hour 30 minutes"></div></section>
<section id="reset" class="scene clip" data-start="10" data-duration="4" data-track-index="1"><div class="scene-content split"><div class="words"><p class="eyebrow">Ready for next time</p><h2>Reopen<br>to reset.</h2><p class="detail">Open the lid.<br>The slider returns to Off.</p></div><img class="panel" src="assets/panel-off.svg" alt="Actual WideAwake panel reset to Off"></div></section>
<section id="outro" class="scene clip" data-start="14" data-duration="4" data-track-index="1"><div class="scene-content outro"><img src="assets/icon.png" alt="WideAwake sunrise"><h2>WideAwake</h2><p class="url">github.com/nazeeh111/WideAwake</p></div></section>
</div><script src="assets/gsap.min.js"></script><script>
window.__timelines=window.__timelines||{};
const timeline=gsap.timeline({paused:true});
timeline.set('.eyebrow',{color:'#F0AB32'},0);
window.__timelines['wideawake-demo']=timeline;
</script></body></html>
