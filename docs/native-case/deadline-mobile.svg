<svg xmlns="http://www.w3.org/2000/svg" width="480" height="780" viewBox="0 0 480 780" role="img" aria-labelledby="t desc"><title id="t">One minute, two deadlines</title><desc id="desc">Recorded software control with simulated system effects. Ready holds an initial sixty-second arming deadline. A simulated lid event forty-seven seconds later schedules a new full minute. Expiry was not observed after the Mac locked.</desc><rect width="100%" height="100%" fill="#fffaf3"/><g font-family="Arial, sans-serif" fill="#252b25"><text x="40" y="42" font-size="18" fill="#98500c">WideAwake / native control case</text><text x="40" y="98" font-size="40">One minute,</text><text x="40" y="144" font-size="40">two deadlines.</text><text x="40" y="220" font-size="22">All system effects simulated.</text><text x="40" y="285" font-size="26">Ready</text><path data-start="0" data-end="60.0" data-scale="3.6" data-x0="40" d="M40.0,330 H256.0" stroke="#b66316" stroke-width="8"/><circle cx="40.0" cy="330" r="7" fill="#b66316"/><circle cx="256.0" cy="330" r="7" fill="#fffaf3" stroke="#b66316" stroke-width="3"/><text x="40.0" y="364" font-size="20">0 s</text><text x="228.0" y="364" font-size="20">60 s</text><text x="40" y="425" font-size="26">Running</text><path data-start="47.0" data-end="107.0" data-scale="3.6" data-x0="40" d="M209.20000000000002,470 H425.2" stroke="#b66316" stroke-width="8"/><circle cx="209.20000000000002" cy="470" r="7" fill="#b66316"/><circle cx="425.2" cy="470" r="7" fill="#fffaf3" stroke="#b66316" stroke-width="3"/><text x="209.20000000000002" y="504" font-size="20">47 s</text><text x="397.2" y="504" font-size="20">107 s</text><text x="40" y="580" font-size="20">Selected duration: 60 seconds.</text><text x="40" y="614" font-size="20">Stored deadline shifts by 47 seconds.</text><text x="40" y="648" font-size="20">The lid event schedules a full minute.</text><text x="40" y="718" font-size="16" fill="#5c625b">Scheduled deadlines only.</text><text x="40" y="745" font-size="16" fill="#5c625b">Expiry, cancel and reopen await unlocked UI.</text></g></svg>