<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"><rect width="1280" height="640" rx="24" fill="#132C35"/><g stroke="#F0AB32" stroke-width="10" fill="none" stroke-linecap="round"><path d="M100 207a57 57 0 0 1 114 0M86 217h142M105 240h103M130 263h53M157 116v-21M104 137l-15-15M209 137l15-15"/></g><g fill="#F8F3E9" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><text x="83" y="344" font-size="72" font-weight="650" letter-spacing="-3">WideAwake</text><text x="87" y="402" font-size="25" fill="#CBD4D3">Set a time. Close the lid. Open to reset.</text><text x="87" y="558" font-size="18" fill="#AAB9B8">15-minute steps · Up to 6 hours · Native macOS</text></g><g transform="translate(790 160)"><rect width="366" height="320" rx="20" fill="#F8F3E9"/><text x="28" y="50" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#132C35">One slider. One job.</text><text x="28" y="135" font-family="Arial,sans-serif" font-size="60" fill="#132C35">1h 30m</text><path d="M30 188h306" stroke="#CDD1C8" stroke-width="7" stroke-linecap="round"/><path d="M30 188h77" stroke="#F0AB32" stroke-width="7" stroke-linecap="round"/><circle cx="107" cy="188" r="13" fill="#132C35"/><text x="28" y="224" font-family="Arial,sans-serif" font-size="14" fill="#66767A">Off</text><text x="318" y="224" font-family="Arial,sans-serif" font-size="14" fill="#66767A">6h</text><text x="28" y="275" font-family="Arial,sans-serif" font-size="15" fill="#66767A">Reopening the lid resets the timer.</text></g></svg>